name: the-long-road-walk-a-dead-traveler-s-journey-staging
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-long-road-walk-a-dead-traveler-s-journey-staging-web
    expose: ["80"]
    environment:
      # Staging shows the differentiator on first load with no hand input.
      SEED_DEMO: "1"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    networks: [default, staging]
    mem_limit: 512m
    oom_score_adj: 800
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  staging:
    external: true
    name: factory-staging-net
